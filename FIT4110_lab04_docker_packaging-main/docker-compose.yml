services:
  iot-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fit4110-iot-lab04-compose
    image: fit4110/iot-ingestion:lab04
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - SERVICE_NAME=${SERVICE_NAME:-iot-ingestion}
      - SERVICE_VERSION=${SERVICE_VERSION:-0.4.0}
      - AUTH_TOKEN=${AUTH_TOKEN:-local-dev-token}
      - ENV=${ENV:-local}
    env_file:
      - .env.example
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - iot-network
    restart: unless-stopped
    labels:
      - "com.fit4110.lab=04"
      - "com.fit4110.service=iot-ingestion"

networks:
  iot-network:
    driver: bridge
